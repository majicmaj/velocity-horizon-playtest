html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: #242424;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {

	border-radius: 0.5rem;
	border: 1px solid #9b3943;

	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}

    async function loadTop() {
        try { render(remote ? (await request('/top?limit=10')).top : local.top(), mine); }
        catch { msg.textContent = 'Couldn’t load the leaderboard.'; render(local.top(), mine); }
    }
    async function startToken(force = false) {
        if (!remote || token || tokenPending || (!force && performance.now() < nextTokenTry)) return;
        tokenPending = true;
        try { token = (await request('/run', {method: 'POST', body: '{}'})).token; }
        catch { token = null; nextTokenTry = performance.now() + 20000; }  // back off instead of retrying every tick
        tokenPending = false;
    }
    function open() {
        panel.dataset.mode = 'finish';
        find('lb-title').textContent = 'RUN COMPLETE';
        submitted = false; busy = false; mine = null;
        find('lb-time').textContent = fmt(state.time);
        find('lb-sub').textContent = `${state.ladybugs || 0} ladybugs · ${state.beetles || 0} beetles`;
        find('lb-heading').textContent = remote ? 'FASTEST RUNS · ALL PLAYERS' : 'YOUR FASTEST RUNS (THIS DEVICE)';
        msg.textContent = remote ? '' : 'The shared leaderboard isn’t connected yet. Times are saved on this device.';
        input.disabled = false; submit.hidden = false; refreshSubmit();
        panel.hidden = false; loadTop();
        setTimeout(() => input.focus({preventScroll: true}), 50);
    }
    function view() {
        panel.dataset.mode = 'view';
        find('lb-title').textContent = 'LEADERBOARD';
        find('lb-heading').textContent = remote ? 'FASTEST RUNS · ALL PLAYERS' : 'YOUR FASTEST RUNS (THIS DEVICE)';
        msg.textContent = remote ? '' : 'The shared leaderboard isn’t connected. Times are saved on this device.';
        mine = store.get('velocity.name', '') || null;
        panel.hidden = false; loadTop();
        find('lb-close').focus({preventScroll: true});
    }
    function close() { panel.hidden = true; input.blur(); }
    // While the view is open, Esc closes it instead of toggling the game's pause.
    window.addEventListener('keydown', event => {
        if (!panel.hidden && panel.dataset.mode === 'view' && event.key === 'Escape') { event.stopPropagation(); event.preventDefault(); close(); }
    }, true);
    find('lb-close').onclick = close;
    find('lb-form').addEventListener('submit', async event => {
        event.preventDefault();
        if (!validName() || busy || submitted) return;
        const name = clean(input.value);
        const entry = {name, time: Math.round(state.time * 1000) / 1000, ladybugs: state.ladybugs || 0, beetles: state.beetles || 0};
        busy = true; refreshSubmit(); msg.textContent = 'Submitting…';
        try {
            if (remote && !token) await startToken(true);
            const data = remote ? await request('/score', {method: 'POST', body: JSON.stringify({...entry, token})}) : local.add(entry);
            if (remote) token = null;
            store.set('velocity.name', name);
            submitted = true; mine = name; input.disabled = true; submit.hidden = true;
            msg.textContent = data.improved === false ? `Your best is still ahead of this run — rank #${data.rank}.` : `You’re #${data.rank}${remote ? '' : ' on this device'}!`;
            render(data.top, name);
        } catch (error) {
            msg.textContent = error.name === 'AbortError' ? 'The leaderboard timed out. Try again.' : `${error.message || 'Couldn’t submit.'} Try again.`;
        }
        busy = false; refreshSubmit();
    });
    find('lb-again').onclick = () => { close(); state.restart_serial++; };

    let completed = false;
    setInterval(() => {
        if (!window.__velocityStartup?.state.ready) return;
        const time = state.time || 0;
        if (time < lastTime - 0.5) token = null;
        lastTime = time;
        if (!state.completed && time > 1) startToken();
        if (!!state.completed !== completed) {
            completed = !!state.completed;
            if (completed) open(); else close();
        }
    }, 100);
    window.__velocityLeaderboard = {remote, base, view, isOpen: () => !panel.hidden};
})();

(() => {
    const canvas = document.getElementById('canvas');
    let timer = null;
    const state = {width: 1920, height: 1080};
    function apply(force = false) {
        const mobile = window.__velocityMobile?.state.enabled;
        const aspect = Math.max(0.42, Math.min(mobile ? 2.4 : 32 / 9, innerWidth / Math.max(innerHeight, 1)));
        const height = Math.min(innerHeight, innerWidth / aspect);
        canvas.style.width = `${height * aspect}px`;
        canvas.style.height = `${height}px`;
        const bufferHeight = mobile ? 720 : 1080;
        const width = 2 * Math.round(bufferHeight * aspect / 2);
        if (force || state.width !== width || state.height !== bufferHeight) {
            state.width = width;
            state.height = bufferHeight;
            canvas.width = state.width;
            canvas.height = state.height;
        }
    }
    window.__velocityDisplay = {state, refresh: () => apply(true)};
    addEventListener('resize', () => { clearTimeout(timer); timer = setTimeout(apply, 120); });
    apply(true);
})();

	engine.startGame({
			'mainPack': "index.pck?build=1f92c83584c5e707",
			'fileSizes': Object.fromEntries(Object.entries(GODOT_CONFIG.fileSizes).map(([name, size]) => [name === 'index.pck' ? "index.pck?build=1f92c83584c5e707" : name, size])),
			'onProgress': function (current, total) {
				startup.engineProgress(current, total);
			},
		}).then(() => {
			startup.engineStarted();
		}, displayFailureNotice);
	}
}());
		</script>
