	<head><script>// Skips shader compiles the game never uses. When Godot's compatibility renderer creates a material it compiles that
// material's scene shader at once in its *default* specialization: every light type, lightmaps and no fog switched on.
// The renderer never draws with that program (every real draw names the lights it lacks, e.g. DISABLE_LIGHT_SPOT, and
// the world always has depth fog); it compiles the specialization it needs at first draw. Through ANGLE/Direct3D in
// Chrome each default program takes 0.2-1.2 s to compile, about 57 s of an 80 s first load, so here their sources are
// swapped for a trivial pair before compiling. Should one ever be used for a draw, it is counted in
// window.__velocityShaderShim.misdraws (the browser checks assert zero).
(() => {
	if (window.__velocityShaderShim || typeof WebGL2RenderingContext === 'undefined') return;
	const shim = window.__velocityShaderShim = {skipped: 0, compiled: 0, misdraws: 0, enabled: !/[?&]shadershim=off\b/.test(location.search)};
	if (!shim.enabled) return;
	const proto = WebGL2RenderingContext.prototype;
	const VERTEX = '#version 300 es\nvoid main() { gl_Position = vec4(0.0); }';
	const FRAGMENT = '#version 300 es\nprecision mediump float;\nout vec4 color;\nvoid main() { color = vec4(0.0); }';
	const unused = source => source.includes('\n#define BASE_PASS') && !source.includes('\n#define USE_DEPTH_FOG')
		&& !source.includes('\n#define DISABLE_LIGHT_');
	const skipped = new WeakSet();
	const shaderSource = proto.shaderSource;
	proto.shaderSource = function(shader, source) {
		if (typeof source === 'string' && unused(source)) {
			shim.skipped++;
			skipped.add(shader);
			const vertex = this.getShaderParameter(shader, this.SHADER_TYPE) === this.VERTEX_SHADER;
			return shaderSource.call(this, shader, vertex ? VERTEX : FRAGMENT);
		}
		shim.compiled++;
		return shaderSource.call(this, shader, source);
	};
	const stubs = new WeakSet();
	const attachShader = proto.attachShader;
	proto.attachShader = function(program, shader) {
		if (skipped.has(shader)) stubs.add(program);
		return attachShader.call(this, program, shader);
	};
	let current = null;
	const useProgram = proto.useProgram;
	proto.useProgram = function(program) { current = program; return useProgram.call(this, program); };
	for (const name of ['drawArrays', 'drawElements', 'drawArraysInstanced', 'drawElementsInstanced', 'drawRangeElements']) {
		const draw = proto[name];
		proto[name] = function(...args) {
			if (current !== null && stubs.has(current)) shim.misdraws++;
			return draw.apply(this, args);
		};
	}
})();
</script><script>// Pre-compiles the game's shader programs while the engine is still downloading. Through ANGLE/Direct3D a first visit
// spends about 80 ms per program, and Godot compiles them one at a time, each blocking a frame. The build records the
// exact programs Godot compiles (tools/web_shader_capture.py) into shaders.json?build=35f4a6a6d004d350; a worker here compiles them all in
// an offscreen WebGL2 context with KHR_parallel_shader_compile, so the browser builds them in parallel (about 1.8 s
// for 120 programs instead of 8 s) and keeps the results in its program cache, where Godot's identical compiles later
// find them. Programs this device would generate differently are simply compiled by Godot as before.
(() => {
	if (window.__velocityShaderPrime || /[?&]shaderprime=off\b/.test(location.search)) return;
	const state = window.__velocityShaderPrime = {total: 0, done: 0, linked: 0, ms: 0, startedAt: 0, finishedAt: 0, finished: false, error: ''};

self.onmessage = async ({data}) => {
	const started = performance.now();

	const known = ['ANGLE_instanced_arrays','EXT_blend_minmax','EXT_disjoint_timer_query','EXT_frag_depth','EXT_shader_texture_lod','EXT_sRGB','OES_element_index_uint','OES_fbo_render_mipmap','OES_standard_derivatives','OES_texture_float','OES_texture_half_float','OES_texture_half_float_linear','OES_vertex_array_object','WEBGL_color_buffer_float','WEBGL_depth_texture','WEBGL_draw_buffers','EXT_color_buffer_float','EXT_conservative_depth','EXT_disjoint_timer_query_webgl2','EXT_texture_norm16','NV_shader_noperspective_interpolation','WEBGL_clip_cull_distance','EXT_clip_control','EXT_color_buffer_half_float','EXT_depth_clamp','EXT_float_blend','EXT_polygon_offset_clamp','EXT_texture_compression_bptc','EXT_texture_compression_rgtc','EXT_texture_filter_anisotropic','KHR_parallel_shader_compile','OES_texture_float_linear','WEBGL_blend_func_extended','WEBGL_compressed_texture_astc','WEBGL_compressed_texture_etc','WEBGL_compressed_texture_etc1','WEBGL_compressed_texture_s3tc','WEBGL_compressed_texture_s3tc_srgb','WEBGL_multi_draw','WEBGL_polygon_mode'];
	for (const name of ['WEBGL_multi_draw','EXT_polygon_offset_clamp','EXT_clip_control','WEBGL_polygon_mode','ANGLE_instanced_arrays','OES_vertex_array_object','WEBGL_draw_buffers','WEBGL_draw_instanced_base_vertex_base_instance','WEBGL_multi_draw_instanced_base_vertex_base_instance','EXT_disjoint_timer_query_webgl2']) gl.getExtension(name);

	const sources = list.sources.map(runs => {
		const lines = [];

	// (and its loading bar) stops drawing for a couple of seconds.
	const build = entry => {

			const shader = gl.createShader(sources[id].includes('gl_Position') ? gl.VERTEX_SHADER : gl.FRAGMENT_SHADER);

		}

		const batch = list.programs.slice(first, first + BATCH).map(build);

			while (batch.some(program => !gl.getProgramParameter(program, parallel.COMPLETION_STATUS_KHR))) await new Promise(resolve => setTimeout(resolve, 4));
		} else {
			for (const program of batch) gl.getProgramParameter(program, gl.LINK_STATUS);
		}

	}

		const started = state.startedAt = Math.round(performance.now());
		const thread = new Worker(URL.createObjectURL(new Blob([worker], {type: 'text/javascript'})));
		thread.onmessage = ({data}) => {
			if (data.error) { state.error = data.error; state.finished = true; thread.terminate(); return; }
			if (data.total !== undefined) state.total = data.total;
			if (data.done !== undefined) state.done = data.done;
			if (data.finished) {
				Object.assign(state, {finished: true, linked: data.linked, ms: Math.round(performance.now() - started), finishedAt: Math.round(performance.now())});
				thread.terminate();
			}
		};
		thread.onerror = event => { state.error = String(event.message || 'worker failed'); state.finished = true; };
		thread.postMessage(text);
	}).catch(error => { state.error = String(error.message || error); state.finished = true; });
})();
</script><script>// Warns players whose browser draws WebGL without the graphics card. With hardware acceleration switched off (a
// common setting in Opera, sometimes in Chrome, Edge and Firefox) WebGL falls back to a software renderer such as
// SwiftShader or the Microsoft Basic Render Driver, which runs this game at a frame or two a second. The page cannot
// change the setting, so it names it: a banner on top of the loading screen and the game, dismissible.
(() => {
	if (window.__velocityGpuCheck) return;
	const check = window.__velocityGpuCheck = {renderer: '', software: false};
	try {
		const gl = document.createElement('canvas').getContext('webgl2');
		if (!gl) return;
		const info = gl.getExtension('WEBGL_debug_renderer_info');
		check.renderer = String(info ? gl.getParameter(info.UNMASKED_RENDERER_WEBGL) : gl.getParameter(gl.RENDERER));
		gl.getExtension('WEBGL_lose_context')?.loseContext();
	} catch (error) {
		return;
	}
	check.software = /swiftshader|basic render|llvmpipe|softpipe|software|warp/i.test(check.renderer)
		|| /[?&]gpucheck=software\b/.test(location.search);  // for testing the banner
	if (!check.software) return;
	const agent = navigator.userAgent;
	const steps = /\bOPR\//.test(agent) ? 'Opera: Settings → System → turn on “Use graphics acceleration when available”, then restart Opera.'
		: /\bEdg\//.test(agent) ? 'Edge: Settings → System and performance → turn on “Use graphics acceleration when available”, then restart Edge.'
		: /Firefox\//.test(agent) ? 'Firefox: Settings → General → Performance → untick “Use recommended performance settings”, tick “Use hardware acceleration when available”, then restart Firefox.'
		: 'Chrome: Settings → System → turn on “Use graphics acceleration when available”, then relaunch Chrome.';
	const show = () => {
		const banner = document.createElement('div');
		banner.id = 'gpu-warning';
		banner.setAttribute('role', 'alert');
		banner.style.cssText = 'position:fixed;z-index:1000;left:50%;top:max(12px,env(safe-area-inset-top));transform:translateX(-50%);'
			+ 'width:min(92vw,720px);box-sizing:border-box;padding:14px 44px 14px 18px;border:2px solid #ff6c48;border-radius:12px;'
			+ 'background:#150e11ee;color:#fff2e9;font:600 15px/1.45 system-ui,sans-serif;box-shadow:0 6px 24px #000a';
		const title = document.createElement('div');
		title.textContent = 'Your browser is running this game without your graphics card, so it will be very slow.';
		title.style.cssText = 'font-size:16px;margin-bottom:6px;color:#ffd2b8';
		const body = document.createElement('div');
		body.textContent = steps;
		const close = document.createElement('button');
		close.type = 'button';
		close.textContent = '×';
		close.setAttribute('aria-label', 'Dismiss');
		close.style.cssText = 'position:absolute;right:10px;top:8px;border:0;background:none;color:#ffd2b8;font:700 22px/1 system-ui;cursor:pointer';
		close.addEventListener('click', () => banner.remove());
		banner.append(title, body, close);
		document.body.appendChild(banner);
	};
	if (document.body) show();
	else document.addEventListener('DOMContentLoaded', show, {once: true});
})();

html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;

	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: #242424;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;

	z-index: 1;
}

            const response = await fetch(base + path, {...options, signal: controller.signal, headers: {'Content-Type': 'application/json'}});
            const data = await response.json().catch(() => ({}));
            if (!response.ok) throw new Error(data.error || `Leaderboard error ${response.status}`);
            return data;
        } finally { clearTimeout(timer); }
    }
    const local = {
        top: () => store.get('velocity.local.' + version, []).slice(0, 10),
        add(entry) {
            const rows = store.get('velocity.local.' + version, []), key = entry.name.toLowerCase();
            const index = rows.findIndex(row => row.name.toLowerCase() === key);
            const improved = index < 0 || rows[index].time > entry.time;
            if (index >= 0 && improved) rows.splice(index, 1);
            if (improved) rows.push(entry);
            rows.sort((a, b) => a.time - b.time); rows.length = Math.min(rows.length, 50);
            store.set('velocity.local.' + version, rows);
            return {rank: rows.findIndex(row => row.name.toLowerCase() === key) + 1, improved, top: rows.slice(0, 10)};
        },
    };

    // The ghost: the fastest run of this version, recorded by the game and raced as a see-through runner. Only the
    // latest version's best run is kept (the Worker holds one; this device keeps one per version and drops older ones).
    const ghostKey = 'velocity.ghost.' + version;
    function useGhost(ghost) {
        if (!ghost || typeof ghost.data !== 'string') return;
        const current = window.__velocityGhost;
        if (current && current.time === ghost.time && current.name === ghost.name && current.data === ghost.data) return;
        window.__velocityGhost = {...ghost, serial: (current?.serial || 0) + 1};
    }
    async function loadGhost() {
        try {
            for (let i = localStorage.length - 1; i >= 0; i--) {
                const key = localStorage.key(i);
                if (key?.startsWith('velocity.ghost.') && key !== ghostKey) localStorage.removeItem(key);
            }
        } catch { /* private mode */ }
        try { useGhost(remote ? (await request('/ghost?version=' + encodeURIComponent(version), {cache: 'no-store'})).ghost : store.get(ghostKey, null)); }
        catch { /* race without a ghost */ }
    }
    loadGhost();
    // The game asks again each time a run restarts, so a new fastest run on the board becomes the ghost straight away.
    window.__velocityRefreshGhost = () => { loadGhost(); };

    const panel = document.createElement('div');
    panel.id = 'lb'; panel.hidden = true;
    panel.innerHTML = `<div class="lb-card" role="dialog" aria-modal="true" aria-labelledby="lb-title">
        <h2 id="lb-title">RUN COMPLETE</h2><div id="lb-time">00:00.00</div><div id="lb-sub"></div>
        <form id="lb-form" autocomplete="off"><input id="lb-name" maxlength="16" placeholder="Your name" autocomplete="nickname" autocapitalize="words" spellcheck="false" aria-label="Your name" required><button id="lb-submit" type="submit" disabled>SUBMIT</button></form>
        <p id="lb-msg" role="status" aria-live="polite"></p>
        <h3 id="lb-heading">FASTEST RUNS</h3><ol id="lb-list"></ol>
        <button id="lb-again" type="button">RACE AGAIN</button><button id="lb-close" type="button">CLOSE</button>
        <p class="lb-page"><a href="leaderboard/" target="_blank" rel="noopener">Full leaderboard page</a></p></div>`;
    document.body.appendChild(panel);
    const input = find('lb-name'), submit = find('lb-submit'), msg = find('lb-msg'), list = find('lb-list');
    input.value = store.get('velocity.name', '');
    for (const type of ['keydown', 'keyup', 'keypress']) panel.addEventListener(type, e => e.stopPropagation());

    let nextTokenTry = 0, token = null, tokenPending = false, lastTime = 0, submitted = false, busy = false, mine = null;
    const validName = () => NAME.test(clean(input.value));
    const refreshSubmit = () => { submit.disabled = busy || submitted || !validName(); };
    input.addEventListener('input', () => { refreshSubmit(); if (!submitted) msg.textContent = ''; });

    function render(rows, highlight) {
        list.innerHTML = rows.length ? rows.map((row, i) => `<li${highlight && row.name.toLowerCase() === highlight.toLowerCase() ? ' class="me"' : ''}><span class="n">${i + 1}</span><span class="who">${esc(row.name)}</span><span class="t">${fmt(row.time)}</span></li>`).join('')
            : '<li class="empty">No times yet — be the first.</li>';
    }
    async function loadTop() {
        try { render(remote ? (await request('/top?limit=10&version=' + encodeURIComponent(version))).top : local.top(), mine); }
        catch { msg.textContent = 'Couldn’t load the leaderboard.'; render(local.top(), mine); }
    }
    async function startToken(force = false) {
        if (!remote || token || tokenPending || (!force && performance.now() < nextTokenTry)) return;
        tokenPending = true;
        try { token = (await request('/run', {method: 'POST', body: '{}'})).token; }
        catch { token = null; nextTokenTry = performance.now() + 20000; }  // back off instead of retrying every tick
        tokenPending = false;
    }
    function open() {
        panel.dataset.mode = 'finish';
        find('lb-title').textContent = 'RUN COMPLETE';
        submitted = false; busy = false; mine = null;
        find('lb-time').textContent = fmt(state.time);
        find('lb-sub').textContent = `${state.ladybugs || 0} ladybugs · ${state.beetles || 0} beetles`;
        find('lb-heading').textContent = remote ? `FASTEST RUNS · ${version.toUpperCase()}` : `YOUR FASTEST RUNS · ${version.toUpperCase()} (THIS DEVICE)`;
        msg.textContent = remote ? '' : 'The shared leaderboard isn’t connected yet. Times are saved on this device.';
        input.disabled = false; submit.hidden = false; refreshSubmit();
        panel.hidden = false; loadTop();
        setTimeout(() => input.focus({preventScroll: true}), 50);
    }
    function view() {
        panel.dataset.mode = 'view';
        find('lb-title').textContent = 'LEADERBOARD';
        find('lb-heading').textContent = remote ? `FASTEST RUNS · ${version.toUpperCase()}` : `YOUR FASTEST RUNS · ${version.toUpperCase()} (THIS DEVICE)`;
        msg.textContent = remote ? '' : 'The shared leaderboard isn’t connected. Times are saved on this device.';
        mine = store.get('velocity.name', '') || null;
        panel.hidden = false; loadTop();
        find('lb-close').focus({preventScroll: true});
    }
    function close() { panel.hidden = true; input.blur(); }
    // While the view is open, Esc closes it instead of toggling the game's pause.
    window.addEventListener('keydown', event => {
        if (!panel.hidden && panel.dataset.mode === 'view' && event.key === 'Escape') { event.stopPropagation(); event.preventDefault(); close(); }
    }, true);
    find('lb-close').onclick = close;
    find('lb-form').addEventListener('submit', async event => {
        event.preventDefault();
        if (!validName() || busy || submitted) return;
        const name = clean(input.value);
        const entry = {name, time: Math.round(state.time * 1000) / 1000, ladybugs: state.ladybugs || 0, beetles: state.beetles || 0};
        let run = null;
        try { run = JSON.parse(state.ghost_run || 'null'); } catch { run = null; }
        if (!run || typeof run.data !== 'string') run = null;
        busy = true; refreshSubmit(); msg.textContent = 'Submitting…';
        try {
            if (remote && !token) await startToken(true);
            const data = remote ? await request('/score', {method: 'POST', body: JSON.stringify({...entry, version, token, ...(run ? {ghost: run} : {})})}) : local.add(entry);
            const best = run && (remote ? data.ghost === true : data.improved && data.rank === 1);
            if (best) {
                const ghost = {...run, name, time: entry.time};
                if (!remote) store.set(ghostKey, ghost);
                useGhost(ghost);  // race again: the new best run is the ghost
            }
            if (remote) token = null;
            store.set('velocity.name', name);
            submitted = true; mine = name; input.disabled = true; submit.hidden = true;
            msg.textContent = data.improved === false ? `Your best is still ahead of this run — rank #${data.rank}.` : `You’re #${data.rank}${remote ? '' : ' on this device'}!${best ? ' Your run is now the ghost to beat.' : ''}`;
            render(data.top, name);
        } catch (error) {
            msg.textContent = error.name === 'AbortError' ? 'The leaderboard timed out. Try again.' : `${error.message || 'Couldn’t submit.'} Try again.`;
        }
        busy = false; refreshSubmit();
    });
    find('lb-again').onclick = () => { close(); state.restart_serial++; };

    let completed = false;
    setInterval(() => {
        if (!window.__velocityStartup?.state.ready) return;
        const time = state.time || 0;
        if (time < lastTime - 0.5) token = null;
        lastTime = time;
        if (!state.completed && time > 1) startToken();
        if (!!state.completed !== completed) {
            completed = !!state.completed;
            if (completed) open(); else close();
        }
    }, 100);
    window.__velocityLeaderboard = {remote, base, view, isOpen: () => !panel.hidden};
})();

(() => {
    const canvas = document.getElementById('canvas');
    let timer = null;
    const state = {width: 1920, height: 1080};
    function apply(force = false) {
        const mobile = window.__velocityMobile?.state.enabled;
        const aspect = Math.max(0.42, Math.min(mobile ? 2.4 : 32 / 9, innerWidth / Math.max(innerHeight, 1)));
        const height = Math.min(innerHeight, innerWidth / aspect);
        canvas.style.width = `${height * aspect}px`;
        canvas.style.height = `${height}px`;
        const bufferHeight = mobile ? 720 : 1080;
        const width = 2 * Math.round(bufferHeight * aspect / 2);
        if (force || state.width !== width || state.height !== bufferHeight) {
            state.width = width;
            state.height = bufferHeight;
            canvas.width = state.width;
            canvas.height = state.height;
        }
    }
    window.__velocityDisplay = {state, refresh: () => apply(true)};
    addEventListener('resize', () => { clearTimeout(timer); timer = setTimeout(apply, 120); });
    apply(true);
})();

	engine.startGame({
			'mainPack': "index.pck?build=35f4a6a6d004d350",
			'fileSizes': Object.fromEntries(Object.entries(GODOT_CONFIG.fileSizes).map(([name, size]) => [name === 'index.pck' ? "index.pck?build=35f4a6a6d004d350" : name, size])),
			'onProgress': function (current, total) {
				startup.engineProgress(current, total);
			},
		}).then(() => {
			startup.engineStarted();
		}, displayFailureNotice);
	}
}());
		</script>
