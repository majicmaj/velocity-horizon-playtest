<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Changelog · Velocity Horizon</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% -20%,#12306a,#050b1c 60%);color:#e8f4ff;font:16px/1.45 system-ui,-apple-system,Segoe UI,sans-serif}
main{max-width:760px;margin:0 auto;padding:32px 16px 48px}
h1{margin:0 0 4px;font-size:28px;letter-spacing:.04em;font-style:italic}p.sub{margin:0 0 20px;color:#8fb8e8}
nav{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:22px}
nav a{display:inline-flex;align-items:center;justify-content:center;min-width:120px;min-height:44px;padding:8px 18px;border:1px solid #3aa0ff;border-radius:10px;background:linear-gradient(#0f3f86,#0a2760);color:#fff;text-decoration:none;font-style:italic;font-weight:700;letter-spacing:.04em}
nav a:hover{filter:brightness(1.2)}nav a[aria-current=page]{background:linear-gradient(#1c5fd0,#1347a3);box-shadow:0 0 12px #3aa0ff88}
article{border:1px solid #2f8fff55;border-radius:12px;background:#06122bcc;padding:12px 16px;margin:0 0 12px}
article h2{margin:0;font-size:17px;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}.v{color:#ffd08a;font-style:italic;font-weight:700}.meta{margin-left:auto;font-size:12px;color:#6f93c4;font-weight:400}
details{margin-top:6px;color:#b9d3f2}summary{cursor:pointer;color:#8fb8e8;font-size:13px}pre{white-space:pre-wrap;margin:8px 0 0;font:13px/1.45 ui-monospace,Consolas,monospace}
#note{color:#ffd08a}
@media(max-width:520px){main{padding:24px 10px 40px}nav a{flex:1 1 0;min-width:0;padding:8px 6px}}
</style>
</head>
<body>
<main>
<h1>Changelog</h1>
<p class="sub">Each published version is a commit. For now this shows the commit messages as written.</p>
<nav aria-label="Site"><a href="../">Play</a><a href="../leaderboard/">Leaderboard</a><a href="./" aria-current="page">Changelog</a></nav>
<div id="list"></div>
<p id="note">Loading…</p>
</main>
<script>
const esc = t => t.replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
fetch('changelog.json', {cache: 'no-cache'}).then(r => r.json()).then(entries => {
  document.getElementById('list').innerHTML = entries.map(e => `<article><h2><span class="v">v${e.version}</span><span>${esc(e.subject)}</span><span class="meta">${esc(e.date)} · ${esc(e.commit)}</span></h2>${e.body ? `<details><summary>Details</summary><pre>${esc(e.body)}</pre></details>` : ''}</article>`).join('');
  document.getElementById('note').textContent = '';
}).catch(() => { document.getElementById('note').textContent = 'Couldn’t load the changelog.'; });
</script>
</body>
</html>
