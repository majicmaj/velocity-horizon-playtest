	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: #242424;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

	display: none;
}

	height: 100%;
	width: 100%;
	object-fit: contain;
}

	image-rendering: pixelated;
}

	display: none;
}

	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

	line-height: 1.3;

	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;

    const ui = document.createElement('div'); ui.id = 'mobile-ui'; ui.hidden = true;
    ui.innerHTML = `<div id="mobile-top"><button id="mobile-settings">Controls</button><button id="mobile-pause">Pause</button></div>
    <div id="mobile-stick" role="application" aria-label="Drag to steer, run or brake">Drag to steer<br>↑ run · ↓ brake</div>
    <div id="mobile-actions"><button data-action="jump">Jump</button><button data-action="boost">Boost</button><button data-action="drift">Drift</button><button data-action="reverse">Reverse</button></div>
    <div id="mobile-menu"><div id="mobile-panel"><h2>Phone controls</h2><p>Landscape recommended. Tilt forward to run, left/right to steer, back to brake. A quick upward flick jumps.</p>
    <p>Hold the phone at your comfortable playing angle when calibrating. Touch Jump is always available.</p><p id="mobile-status" role="status" aria-live="polite">Choose tilt or touch controls.</p>
    <div class="choices"><button id="mobile-tilt">Enable tilt / Recenter</button><button id="mobile-touch">Use touch</button><button id="mobile-resume">Resume</button><button id="mobile-restart">Restart run</button></div>
    <label><input id="mobile-invert-steer" type="checkbox"> Invert steering</label><label><input id="mobile-invert-tilt" type="checkbox"> Invert forward / back</label></div></div>`;
    document.body.appendChild(ui);
    const find = id => document.getElementById(id), menu = find('mobile-menu'), status = find('mobile-status');
    function openMenu() { pause(true); menu.hidden = false; find('mobile-pause').textContent = 'Resume'; }
    function play() { unlockAudio(); request++; core.calibrating = false; pause(false); menu.hidden = true; find('mobile-pause').textContent = 'Pause'; }
    find('mobile-settings').onclick = openMenu;
    find('mobile-pause').onclick = () => { if (state.paused) play(); else openMenu(); };
    find('mobile-resume').onclick = play;
    find('mobile-touch').onclick = () => { core.mode = 'touch'; core.calibrated = false; core.message = 'Touch controls'; play(); };
    find('mobile-restart').onclick = () => { state.restart_serial++; play(); };
    find('mobile-invert-steer').onchange = e => { core.invertSteer = e.target.checked; };
    find('mobile-invert-tilt').onchange = e => { core.invertTilt = e.target.checked; };
    const angle = () => screen.orientation?.angle ?? window.orientation ?? 0;
    function sensors() {
        if (listening) return;
        listening = true;
        addEventListener('deviceorientation', e => core.orientation(e.beta, e.gamma, angle(), performance.now()));
        addEventListener('devicemotion', e => core.motion(e.acceleration, e.accelerationIncludingGravity, performance.now()));
        const rotate = () => { clear(); core.calibrated = false; core.calibrating = false; core.message = 'Screen rotated — tap Recenter'; openMenu(); };
        if (screen.orientation) screen.orientation.addEventListener('change', rotate);
        else addEventListener('orientationchange', rotate);
    }
    find('mobile-tilt').onclick = () => {
        unlockAudio();
        if (!isSecureContext || typeof DeviceOrientationEvent === 'undefined') {
            core.message = 'Motion unavailable here — choose Use touch'; status.textContent = core.message; return;
        }
        const id = ++request;
        const ask = type => { try { return typeof type?.requestPermission === 'function' ? type.requestPermission() : Promise.resolve('granted'); } catch (e) { return Promise.reject(e); } };
        const orientationPermission = ask(window.DeviceOrientationEvent);
        const motionPermission = ask(window.DeviceMotionEvent);
        Promise.allSettled([orientationPermission, motionPermission]).then(results => {
            if (id !== request) return;
            if (results[0].status !== 'fulfilled' || results[0].value !== 'granted') {
                core.message = 'Motion permission denied — choose Use touch'; status.textContent = core.message; return;
            }
            sensors(); core.angle = angle(); core.calibrate(performance.now());
            status.textContent = core.message;
        });
    };
    const pad = find('mobile-stick'); let stickPointer = null;
    function move(e) {
        if (e.pointerId !== stickPointer) return;
        const r = pad.getBoundingClientRect(), axis = v => Math.max(-1, Math.min(1, v));
        stick = {x: axis((e.clientX - r.left - r.width / 2) / (r.width * 0.36)), y: axis((e.clientY - r.top - r.height / 2) / (r.height * 0.36))};
        e.preventDefault();
    }
    pad.onpointerdown = e => { if (stickPointer !== null || state.paused) return; stickPointer = e.pointerId; pad.setPointerCapture(e.pointerId); move(e); };
    pad.onpointermove = move;
    const releaseStick = e => { if (e.pointerId === stickPointer) { stickPointer = null; stick = {x: 0, y: 0}; } };
    pad.onpointerup = pad.onpointercancel = pad.onlostpointercapture = releaseStick;
    ui.querySelectorAll('[data-action]').forEach(button => {
        button.onpointerdown = e => {
            if (state.paused) return;
            e.preventDefault(); button.setPointerCapture(e.pointerId); held.set(e.pointerId, button.dataset.action);
            if (button.dataset.action === 'jump') touchJumps++;
        };
        button.onpointerup = button.onpointercancel = button.onlostpointercapture = e => held.delete(e.pointerId);
    });
    addEventListener('blur', openMenu);
    document.addEventListener('visibilitychange', () => { if (document.hidden) openMenu(); });
    setInterval(() => {
        if (!window.__velocityStartup?.state.ready) return;
        ui.hidden = false; api.tick();
        if (core.calibrated && core.mode === 'tilt' && !menu.hidden && core.message.startsWith('Tilt ready')) { pause(false); menu.hidden = true; core.message = 'Tilt enabled'; }
        status.textContent = core.message;
        find('mobile-pause').textContent = state.paused ? 'Resume' : 'Pause';
    }, 200);
})();

(() => {
    if (window.__velocityHud || !document.body) return;
    const mobile = window.__velocityMobile, state = mobile.state;
    const W = 1400, H = 560;
    const regions = {
        stick:[0,0,365,365],boost:[369,0,246,237],jump:[619,0,190,184],drift:[813,0,187,182],reverse:[1004,0,193,180],
        knob:[1201,0,112,112],pause:[0,369,270,97],controls:[274,369,320,93],bar:[0,470,1155,90]
    };
    const layer = (file,id='') => `<span class="race-art"${id?` id="${id}"`:''} aria-hidden="true"><img src="ui/${file}?v=e352ca4f521e" alt=""></span>`;
    function art(name) {
        const [x,y,w,h] = regions[name];
        return `<span class="race-art" aria-hidden="true"><img src="ui/hud-atlas.png?v=e352ca4f521e" style="width:${W/w*100}%;height:${H/h*100}%;left:${-x/w*100}%;top:${-y/h*100}%" alt=""></span>`;
    }
    const hud = document.createElement('div'); hud.id = 'race-hud'; hud.hidden = true;
    hud.innerHTML = `<button id="race-controls" class="race-tab" aria-label="Controls">${art('controls')}<span>CONTROLS</span></button>
        <div id="race-top">${art('bar')}<div id="race-values"><div><b id="race-ladybugs">000</b><small>LADYBUGS</small></div><div><b id="race-beetles">000</b><small>BEETLES</small></div><div><b id="race-distance">0 m</b><small>DISTANCE</small></div><div><b id="race-time">00:00</b><small>TIME</small></div></div></div>
        <button id="race-pause" class="race-tab" aria-label="Pause">${art('pause')}<span>PAUSE</span></button>
        <button id="race-fullscreen" aria-label="Fullscreen" title="Fullscreen">⛶</button><div id="race-toast" role="status"></div>
        <div id="race-dial">${layer('hud-dial.png')}${layer('hud-dial-fill.png','race-arc')}${layer('hud-dial-fill.png','race-fill')}<div id="race-speed">000 <small>km/h</small></div><div id="race-charge" aria-label="Boost">100%</div></div>`;
    document.body.appendChild(hud);
    const find = id => document.getElementById(id);
    let toastUntil = 0, lastLadybugs = 0, lastBeetles = 0, speed = 0, lastTime = 0;
    function toast(message) { find('race-toast').textContent = message; toastUntil = performance.now()+1800; }
    function pause(value) { state.paused=value; state.pause_serial++; }
    find('race-controls').onclick = () => {
        if (state.enabled) find('mobile-settings').click();
        else { pause(true); toast('W / arrows drive · Ctrl drift · Shift boost · Space jump · Esc resumes'); }
    };
    find('race-pause').onclick = () => {
        if (state.enabled) find('mobile-pause').click();
        else { mobile.unlock_audio?.(); pause(!state.paused); }
    };
    find('race-fullscreen').onclick = async () => {
        const root = document.documentElement;
        try {
            if (document.fullscreenElement || document.webkitFullscreenElement) {
                const exit = document.exitFullscreen || document.webkitExitFullscreen;
                if (exit) await exit.call(document);
            } else {
                const enter = root.requestFullscreen || root.webkitRequestFullscreen;
                if (!enter) { toast('Fullscreen unavailable — use your browser’s Add to Home Screen option'); return; }
                await enter.call(root);
            }
            window.__velocityDisplay?.refresh();
        } catch (e) { toast('Fullscreen was blocked by this browser'); }
    };
    const fullscreenChanged = () => {
        const label = (document.fullscreenElement || document.webkitFullscreenElement) ? 'Exit fullscreen' : 'Fullscreen';
        find('race-fullscreen').setAttribute('aria-label',label); find('race-fullscreen').title=label;
        window.__velocityDisplay?.refresh();
    };
    document.addEventListener('fullscreenchange', fullscreenChanged);
    document.addEventListener('webkitfullscreenchange', fullscreenChanged);
    function decorate() {
        if (!state.enabled || !find('mobile-stick') || find('mobile-knob')) return;
        const pad = find('mobile-stick'); pad.innerHTML = art('stick')+`<span id="mobile-knob">${art('knob')}</span>`;
        document.querySelectorAll('#mobile-actions button').forEach(button => {
            const name = button.dataset.action;
            button.innerHTML = art(name);
            button.setAttribute('aria-label',name[0].toUpperCase()+name.slice(1));
        });
    }
    const fields = ['race-ladybugs','race-beetles','race-distance','race-time','race-speed','race-charge'];
    function frame(now) {
        requestAnimationFrame(frame);
        if (now-lastTime < 32) return;
        const dt = Math.min((now-lastTime)/1000,0.1); lastTime=now;
        if (!window.__velocityStartup?.state.ready) return;
        hud.hidden=false; decorate();
        const ladybugs = state.ladybugs || 0, beetles = state.beetles || 0;
        if (ladybugs > lastLadybugs) toast(`+${ladybugs-lastLadybugs} km/h · LADYBUG`);
        else if (beetles > lastBeetles) toast(`+${beetles-lastBeetles}% BOOST · BEETLE`);
        lastLadybugs=ladybugs; lastBeetles=beetles;
        speed += ((state.speed || 0)-speed)*(1-Math.exp(-dt*14));
        const time = state.time || 0, charge = Math.max(0,Math.min(1,state.charge ?? 1));
        const values = [String(ladybugs).padStart(3,'0'),String(beetles).padStart(3,'0'),`${Math.round(state.distance || 0).toLocaleString()} m`,
            `${String(Math.floor(time/60)).padStart(2,'0')}:${(time%60).toFixed(1).padStart(4,'0')}`,`${String(Math.round(speed)).padStart(3,'0')} <small>km/h</small>`,`${Math.round(charge*100)}%`];
        fields.forEach((id,i)=>{ if(find(id).innerHTML!==values[i]) find(id).innerHTML=values[i]; });
        find('race-pause').lastElementChild.textContent=state.paused?'RESUME':'PAUSE';
        find('race-pause').setAttribute('aria-label',state.paused?'Resume':'Pause');
        find('race-toast').classList.toggle('show',now<toastUntil);
        find('race-arc').style.setProperty('--p',Math.min(1,speed/300).toFixed(3));
        find('race-fill').style.setProperty('--c',(Math.ceil(charge*8)/8).toFixed(3));
        const knob=find('mobile-knob'); if(knob) knob.style.transform=`translate(${state.steer*85}%,${(state.brake-state.throttle)*85}%)`;
    }
    window.__velocityHud = {toast}; requestAnimationFrame(frame);
})();

(() => {
    const canvas = document.getElementById('canvas');
    let timer = null;
    const state = {width: 1920, height: 1080};
    function apply(force = false) {
        const mobile = window.__velocityMobile?.state.enabled;
        const aspect = Math.max(mobile ? 0.5 : 16 / 9, Math.min(mobile ? 2.4 : 32 / 9, innerWidth / Math.max(innerHeight, 1)));
        const height = Math.min(innerHeight, innerWidth / aspect);
        canvas.style.width = `${height * aspect}px`;
        canvas.style.height = `${height}px`;
        const bufferHeight = mobile ? 720 : 1080;
        const width = 2 * Math.round(bufferHeight * aspect / 2);
        if (force || state.width !== width || state.height !== bufferHeight) {
            state.width = width;
            state.height = bufferHeight;
            canvas.width = state.width;
            canvas.height = state.height;
        }
    }
    window.__velocityDisplay = {state, refresh: () => apply(true)};
    addEventListener('resize', () => { clearTimeout(timer); timer = setTimeout(apply, 120); });
    apply(true);
})();

	engine.startGame({
			'mainPack': "index.pck?build=d944a2fab66bb508",
			'fileSizes': Object.fromEntries(Object.entries(GODOT_CONFIG.fileSizes).map(([name, size]) => [name === 'index.pck' ? "index.pck?build=d944a2fab66bb508" : name, size])),
			'onProgress': function (current, total) {
				startup.engineProgress(current, total);
			},
		}).then(() => {
			startup.engineStarted();
		}, displayFailureNotice);
	}
}());
