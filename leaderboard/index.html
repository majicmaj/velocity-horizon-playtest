<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Leaderboard · Velocity Horizon</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% -20%,#12306a,#050b1c 60%);color:#e8f4ff;font:16px/1.4 system-ui,-apple-system,Segoe UI,sans-serif}
main{max-width:720px;margin:0 auto;padding:32px 16px 48px}
h1{margin:0 0 4px;font-size:28px;letter-spacing:.04em;font-style:italic}p.sub{margin:0 0 20px;color:#8fb8e8}
nav{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:22px}
nav a{display:inline-flex;align-items:center;justify-content:center;min-width:120px;min-height:44px;padding:8px 18px;border:1px solid #3aa0ff;border-radius:10px;background:linear-gradient(#0f3f86,#0a2760);color:#fff;text-decoration:none;font-style:italic;font-weight:700;letter-spacing:.04em}
nav a:hover{filter:brightness(1.2)}nav a[aria-current=page]{background:linear-gradient(#1c5fd0,#1347a3);box-shadow:0 0 12px #3aa0ff88}
table{width:100%;border-collapse:separate;border-spacing:0;border:1px solid #2f8fff66;border-radius:14px;overflow:hidden;background:#06122bcc}
th,td{padding:11px 14px;text-align:left}th{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#6fb4ff;background:#0a1f4a;border-bottom:1px solid #2f8fff66}
tbody tr:nth-child(even){background:#0a1f4a66}td.rank{width:64px;color:#6fb4ff;font-variant-numeric:tabular-nums}tbody tr:nth-child(-n+3) td.rank{color:#ffd08a;font-weight:700}
td.name{overflow-wrap:anywhere}th.num,td.num{text-align:right;font-variant-numeric:tabular-nums}td.time{font-weight:700}td.num:not(.time){color:#b9d3f2}
#note{margin:14px 2px;color:#ffd08a;min-height:1.4em}footer{margin-top:26px;font-size:13px;color:#6f93c4}
@media(max-width:520px){main{padding:24px 10px 40px}nav a{flex:1 1 0;min-width:0;padding:8px 6px}th,td{padding:10px 8px}th{font-size:10px;letter-spacing:.04em}td.rank{width:44px}table{font-size:15px}}
</style>
</head>
<body>
<main>
<h1>Leaderboard</h1>
<p class="sub">Fastest finishes, all players.</p>
<nav aria-label="Site"><a href="../">Play</a><a href="./" aria-current="page">Leaderboard</a><a href="../changelog/">Changelog</a></nav>
<table>
<thead><tr><th class="rank">Rank</th><th>Name</th><th class="num">Time</th><th class="num opt">Ladybugs</th><th class="num opt">Beetles</th></tr></thead>
<tbody id="rows" aria-live="polite"></tbody>
</table>
<p id="note">Loading…</p>
<footer>Times come from players' browsers and are lightly checked, not tamper-proof. <span id="stamp"></span></footer>
</main>
<script>
const base = 'https://velocity-horizon-leaderboard.majed-tarabein.workers.dev'.replace(/\/+$/, '');
const rows = document.getElementById('rows'), note = document.getElementById('note');
const fmt = s => `${String(Math.floor(s / 60)).padStart(2, '0')}:${(s % 60).toFixed(2).padStart(5, '0')}`;
const esc = t => t.replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
async function load() {
  if (!base) { note.textContent = 'The shared leaderboard is not connected.'; return; }
  try {
    const response = await fetch(base + '/top?limit=50');
    if (!response.ok) throw new Error(response.status);
    const {top} = await response.json();
    rows.innerHTML = top.map((r, i) => `<tr><td class="rank">${i + 1}</td><td class="name">${esc(r.name)}</td><td class="num time">${fmt(r.time)}</td><td class="num opt">${r.ladybugs}</td><td class="num opt">${r.beetles}</td></tr>`).join('');
    note.textContent = top.length ? '' : 'No times yet. Be the first!';
    document.getElementById('stamp').textContent = 'Updated ' + new Date().toLocaleTimeString();
  } catch (error) { note.textContent = 'Couldn’t load the leaderboard. Try again in a moment.'; }
}
load(); setInterval(load, 60000);
</script>
</body>
</html>
