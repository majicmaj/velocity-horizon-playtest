<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<title>Velocity Horizon</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: #242424;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}
		</style>
		<link rel='icon' href='index.png'><style>#canvas { width: min(100vw, calc(100vh * 16 / 9)); height: min(100vh, calc(100vw * 9 / 16)); margin: auto; position: absolute; inset: 0; }</style>

	<body>
		<canvas id="canvas" width="1920" height="1080">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<img id="status-splash" class="show-image--true fullsize--true use-filter--true" src="index.png" alt="">
			<progress id="status-progress"></progress>
			<div id="status-notice"></div>
		</div>

		<script src="index.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":0,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":40393292,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');
	const phaseLabel = document.createElement('div');
	phaseLabel.id = 'status-phase';
	phaseLabel.setAttribute('role', 'status');
	phaseLabel.setAttribute('aria-live', 'polite');
	phaseLabel.style.cssText = 'position:absolute;bottom:16%;left:5%;right:5%;text-align:center;font:16px Arial,sans-serif;color:white;z-index:1';
	statusOverlay.appendChild(phaseLabel);
	const startup = window.__velocityStartup = (() => {
		const state = {phase: 'engine-download', completed: 0, total: 0,
			engineFinished: false, gameReady: false, ready: false, failed: false,
			startedAt: performance.now()};
		function report(phase, completed, total, label) {
			if (state.ready || state.failed) return;
			Object.assign(state, {phase, completed, total});
			phaseLabel.textContent = label;
			setStatusMode('progress');
			if (total > 0) {
				statusProgress.max = total;
				statusProgress.value = Math.min(completed, total);
			} else {
				statusProgress.removeAttribute('value');
				statusProgress.removeAttribute('max');
			}
		}
		function finishIfReady() {
			if (!state.engineFinished || !state.gameReady || state.failed || state.ready) return;
			requestAnimationFrame(() => {
				if (state.failed || state.ready) return;
				state.ready = true;
				state.phase = 'ready';
				state.durationMs = performance.now() - state.startedAt;
				setStatusMode('hidden');
			});
		}
		return {
			state, report,
			engineProgress(current, total) {
				if (state.phase !== 'engine-download') return;
				const known = current > 0 && total > 0;
				report('engine-download', known ? current : 0, known ? total : 0,
					known ? `Downloading engine and game: ${current} / ${total} bytes` : 'Downloading engine and game...');
			},
			engineStarted() {
				state.engineFinished = true;
				state.engineStartedAt = performance.now();
				if (state.phase === 'engine-download') report('engine-start', 0, 0, 'Starting engine...');
				finishIfReady();
			},
			gameReady() {
				state.gameReady = true;
				state.gameReadyAt = performance.now();
				finishIfReady();
			},
			fail() { state.failed = true; phaseLabel.style.display = 'none'; },
		};
	})();


	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		startup.fail();
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		startup.engineProgress(0, 0);
		engine.startGame({
			'onProgress': function (current, total) {
				startup.engineProgress(current, total);
			},
		}).then(() => {
			startup.engineStarted();
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
</html>
